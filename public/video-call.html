<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Video Consultation - Alamnagar CHC</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .call-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
    }
    .call-brand img {
      height: 36px;
      width: auto;
    }
    .call-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #2dd4bf;
    }
    .call-meta {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    #video-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
      position: relative;
      background-color: #020617;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 5;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="https://8x8.vc/external_api.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="call-brand">
      <img src="alchc-logo.png" alt="Alamnagar CHC Logo">
      <div>
        <div class="call-title">Alamnagar CHC Video Consultation</div>
        <div class="call-meta" id="patient-display">Loading appointment details...</div>
      </div>
    </a>
    <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
      <select id="server-select" style="background: #334155; color: white; border: 1px solid #475569; padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer;">
        <option value="meet.element.io">Node 1 (Element Global)</option>
        <option value="meet.ffm.freifunk.net">Node 2 (Freifunk Cluster)</option>
        <option value="jitsi.member.fsf.org">Node 3 (FSF Network)</option>
      </select>
      <a id="external-call-btn" href="#" target="_blank" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.82rem; background: #0d9488; color: white; border-radius: 6px; text-decoration: none;">🌐 Open Fullscreen</a>
      <a href="javascript:history.back()" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.82rem; background: #334155; color: white; border-radius: 6px; text-decoration: none;">&larr; Exit</a>
    </div>
  </header>

  <div id="video-container">
    <div class="loading-overlay" id="loading-spinner">
      <div class="spinner"></div>
      <p style="font-size: 1.1rem; color: #cbd5e1;">Connecting to Secure Video Room...</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const apptId = urlParams.get('appointment_id');
      const rawRoom = urlParams.get('room');
      let displayName = urlParams.get('name') || 'Guest User';

      let roomName = '';

      // Synchronize room ID directly from API so Doctor and Patient always connect to the exact same room
      if (apptId) {
        try {
          const res = await fetch(`/api/appointments/${apptId}/video-room?t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (data.room_id || data.video_room_id) {
              const r = data.room_id || data.video_room_id;
              roomName = r.replace(/[^a-zA-Z0-9]/g, '');
            }
            if (data.patient_name) {
              displayName = data.patient_name;
            }
          }
        } catch (e) {
          console.warn('API lookup failed, falling back to URL room:', e);
        }
      }

      if (!roomName && rawRoom) {
        roomName = rawRoom.replace(/[^a-zA-Z0-9]/g, '');
      }

      if (!roomName || roomName.length < 5) {
        roomName = 'AlamnagarChcConsultationRoom' + (apptId || 'General');
      }

      const patientDisplay = document.getElementById('patient-display');
      if (patientDisplay) {
        patientDisplay.textContent = `Patient: ${displayName}${apptId ? ' (Appt #' + apptId + ')' : ''}`;
      }

      const container = document.getElementById('video-container');
      const spinner = document.getElementById('loading-spinner');
      const serverSelect = document.getElementById('server-select');
      const extBtn = document.getElementById('external-call-btn');

      function loadRoom(serverDomain) {
        if (spinner) spinner.style.display = 'flex';
        
        const videoUrl = `https://${serverDomain}/${roomName}#config.prejoinPageEnabled=false&config.enableLobby=false&config.disableLobby=true&config.startWithAudioMuted=false&config.startWithVideoMuted=false&userInfo.displayName="${encodeURIComponent(displayName)}"`;

        if (extBtn) extBtn.href = videoUrl;

        // Use direct un-moderated WebRTC iframe to guarantee 0 moderator locks and 0 logins
        container.innerHTML = `<iframe src="${videoUrl}" allow="camera; microphone; display-capture; autoplay" style="width:100%; height:100%; border:none;"></iframe>`;

        setTimeout(() => {
          if (spinner) spinner.style.display = 'none';
        }, 1500);
      }

      if (serverSelect) {
        serverSelect.addEventListener('change', (e) => {
          loadRoom(e.target.value);
        });
      }

      // Initial load with meet.element.io (Element Global Anycast WebRTC Node)
      loadRoom('meet.element.io');
    });
  </script>
</body>
</html>
