<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Video Consultation - Alamnagar CHC</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .call-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
    }
    .call-brand img {
      height: 36px;
      width: auto;
    }
    .call-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #2dd4bf;
    }
    .call-meta {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    #video-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
      position: relative;
      background-color: #020617;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 5;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="https://meet.ffm.freifunk.net/external_api.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="call-brand">
      <img src="alchc-logo.png" alt="Alamnagar CHC Logo">
      <div>
        <div class="call-title">Alamnagar CHC Video Consultation</div>
        <div class="call-meta" id="patient-display">Loading appointment details...</div>
      </div>
    </a>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a id="external-call-btn" href="#" target="_blank" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.82rem; background: #0d9488; color: white; border-radius: 6px; text-decoration: none;">🌐 Open Fullscreen</a>
      <a href="javascript:history.back()" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.82rem; background: #334155; color: white; border-radius: 6px; text-decoration: none;">&larr; Exit</a>
    </div>
  </header>

  <div id="video-container">
    <div class="loading-overlay" id="loading-spinner">
      <div class="spinner"></div>
      <p style="font-size: 1.1rem; color: #cbd5e1;">Connecting to Secure Video Room...</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rawRoom = urlParams.get('room') || 'AlamnagarChcConsultGeneral';
      const displayName = urlParams.get('name') || 'Guest User';
      const apptId = urlParams.get('appointment_id');

      // Sanitize room name (remove hyphens/special chars to prevent moderator locks)
      let roomName = rawRoom.replace(/[^a-zA-Z0-9]/g, '');
      if (!roomName || roomName.length < 5) {
        roomName = 'AlamnagarChcConsultationRoom' + (apptId || 'General');
      }

      const domain = 'meet.ffm.freifunk.net';

      const extBtn = document.getElementById('external-call-btn');
      if (extBtn) {
        extBtn.href = `https://${domain}/${roomName}#userInfo.displayName="${encodeURIComponent(displayName)}"`;
      }

      const patientDisplay = document.getElementById('patient-display');
      if (patientDisplay) {
        patientDisplay.textContent = `Patient: ${displayName}${apptId ? ' (Appt #' + apptId + ')' : ''}`;
      }

      const container = document.getElementById('video-container');
      const spinner = document.getElementById('loading-spinner');

      try {
        const options = {
          roomName: roomName,
          width: '100%',
          height: '100%',
          parentNode: container,
          userInfo: {
            displayName: displayName
          },
          configOverwrite: {
            startWithAudioMuted: false,
            startWithVideoMuted: false,
            prejoinConfig: { enabled: false },
            prejoinPageEnabled: false,
            enableLobby: false,
            disableLobby: true,
            requireDisplayName: false,
            disableDeepLinking: true
          },
          interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
              'microphone', 'camera', 'desktop', 'fullscreen', 'hangup',
              'profile', 'chat', 'settings', 'tileview'
            ],
            SHOW_JITSI_WATERMARK: false,
            SHOW_WATERMARK_FOR_GUESTS: false,
            DEFAULT_BACKGROUND: '#0f172a'
          }
        };

        const api = new JitsiMeetExternalAPI(domain, options);
        api.addEventListener('videoConferenceJoined', () => {
          if (spinner) spinner.style.display = 'none';
        });

        setTimeout(() => {
          if (spinner) spinner.style.display = 'none';
        }, 3000);
      } catch (e) {
        console.error('Jitsi API failed, loading iframe fallback', e);
        if (spinner) spinner.style.display = 'none';
        container.innerHTML = `<iframe src="https://${domain}/${roomName}" allow="camera; microphone; display-capture; autoplay"></iframe>`;
      }
    });
  </script>
</body>
</html>
